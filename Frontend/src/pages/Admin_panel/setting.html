<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – TravelX</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .toggle-switch {
      width: 52px; height: 28px; background: #ccc; border-radius: 20px;
      position: relative; cursor: pointer; transition: 0.3s;
    }
    .toggle-switch::after {
      content: ''; position: absolute; width: 22px; height: 22px;
      background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.3s;
    }
    .toggle-switch.active { background: #27ae60; }
    .toggle-switch.active::after { left: 27px; }
    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 0; border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Travel<span>X</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="settings.html" class="active">Settings</a></li>
    </ul>
    <div class="auth-buttons">
      <a href="profile.html" class="btn btn-outline">Back to Profile</a>
    </div>
  </nav>

  <div class="settings-container">
    <h2 style="color:var(--primary); margin-bottom:1.5rem;">Account Settings</h2>

    <div class="card" style="padding:2rem;">
      <div class="setting-row">
        <div>
          <strong>Email Notifications</strong>
          <p style="font-size:0.9rem;color:#666;">Deal alerts & booking updates</p>
        </div>
        <div class="toggle-switch active"></div>
      </div>

      <div class="setting-row">
        <div>
          <strong>SMS Alerts</strong>
          <p style="font-size:0.9rem;color:#666;">Flight status & price drops</p>
        </div>
        <div class="toggle-switch"></div>
      </div>

      <div class="setting-row">
        <div>
          <strong>Dark Mode</strong>
          <p style="font-size:0.9rem;color:#666;">Switch theme (demo)</p>
        </div>
        <div class="toggle-switch" id="themeToggle"></div>
      </div>

      <div class="setting-row">
        <div>
          <strong>Two-Factor Authentication</strong>
          <p style="font-size:0.9rem;color:#666;">Extra security for your account</p>
        </div>
        <div class="toggle-switch"></div>
      </div>

      <div style="margin-top:2rem;">
        <div class="form-group">
          <label>Preferred Currency</label>
          <select>
            <option>INR – Indian Rupee</option>
            <option>USD – US Dollar</option>
            <option>EUR – Euro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Language</label>
          <select>
            <option>English</option>
            <option>Hindi</option>
            <option>Spanish</option>
          </select>
        </div>
      </div>

      <button id="saveSettings" class="btn btn-primary" style="margin-top:1rem;">Save Changes</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
