<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Voyageora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">✈️</div>
        <h1>Admin Panel</h1>
        <p>Sign in to manage Voyageora</p>
      </div>

      <div class="error-msg"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="admin@voyageora.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" required />
            <button type="button" class="toggle-pass" aria-label="Toggle password">👁️</button>
          </div>
        </div>

        <div class="remember-row">
          <label>
            <input type="checkbox" id="remember" />
            Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="login-footer">
        <a href="index.html">← Back to website</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
