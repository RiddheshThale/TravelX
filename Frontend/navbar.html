<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel Navbar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f2f2f2;
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    padding: 10px 30px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  /* Logo */
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 800;
    color: #eb2026;
    cursor: pointer;
  }

  .logo .logo-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #eb2026;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .logo span.brand {
    letter-spacing: 0.5px;
  }

  .logo span.brand small {
    display: block;
    font-size: 10px;
    font-weight: 500;
    color: #666;
    letter-spacing: 0;
  }

  /* Nav items */
  .nav-items {
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 6px 4px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.2s ease;
  }

  .nav-item:hover {
    border-color: #eb2026;
  }

  .nav-item .icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #eb2026;
  }

  .nav-item .text {
    line-height: 1.2;
  }

  .nav-item .text .title {
    font-size: 13.5px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .nav-item .text .subtitle {
    font-size: 11px;
    color: #777;
  }

  /* Divider */
  .divider {
    width: 1px;
    height: 32px;
    background: #e0e0e0;
  }

  /* Profile / settings */
  .profile-group {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #444;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .icon-btn:hover {
    background: #ececec;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #eb2026;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .login-block {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .login-block .text .title {
    font-size: 13px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .login-block .text .subtitle {
    font-size: 11px;
    color: #777;
  }

  .lang-select {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    cursor: pointer;
    padding: 6px 4px;
  }

  /* Responsive */
  @media (max-width: 1000px) {
    .nav-item .text { display: none; }
    .nav-items { gap: 16px; }
  }

  @media (max-width: 700px) {
    .navbar { flex-wrap: wrap; gap: 10px; }
    .nav-items { order: 3; width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<nav class="navbar">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">✈</div>
    <span class="brand">TravelGo<small>Beyond Boundaries</small></span>
  </div>

  <!-- Nav items -->
  <div class="nav-items">

    <div class="nav-item">
      <div class="icon">🏠</div>
      <div class="text">
        <div class="title">List Your Property</div>
        <div class="subtitle">Grow your business!</div>
      </div>
    </div>

    <div class="nav-item">
      <div class="icon">💼</div>
      <div class="text">
        <div class="title">Introducing myBiz</div>
        <div class="subtitle">Business Travel Solution</div>
      </div>
    </div>

    <div class="nav-item">
      <div class="icon">🧳</div>
      <div class="text">
        <div class="title">My Trips</div>
        <div class="subtitle">Manage your bookings</div>
      </div>
    </div>

    <div class="nav-item">
      <div class="icon">❤</div>
      <div class="text">
        <div class="title">Wishlist</div>
        <div class="subtitle">Save favourites</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="login-block">
      <div class="avatar">A</div>
      <div class="text">
        <div class="title">Login or Create Account</div>
        <div class="subtitle">INR | English</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="profile-group">
      <div class="icon-btn" title="Settings">⚙</div>
      <div class="icon-btn" title="Profile">👤</div>
    </div>

  </div>

</nav>

</body>
</html>
