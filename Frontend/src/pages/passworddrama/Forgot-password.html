<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password · TravelX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="Forget-password.css" />
</head>
<body>

<div class="reset-page">

  <div class="reset-card">

    <a href="signin.html" class="back-link">← Back to sign in</a>

    <div class="mobile-logo">
      <img src="images/logo.png" alt="TravelX logo" class="logo-icon-img" /> TravelX
    </div>

    <!-- Step 1: request reset -->
    <div class="step step-request" id="stepRequest">
      <div class="icon-badge">
        <span class="key-icon">🔑</span>
      </div>
      <h1>Forgot your password?</h1>
      <p class="subtext">No worries. Enter the email linked to your account and we'll send you a reset link.</p>

      <form id="resetForm" novalidate>
        <div class="field">
          <input type="email" id="email" placeholder=" " autocomplete="email" required />
          <label for="email">Email address</label>
          <span class="error-msg">Enter a valid email address</span>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-text">Send Reset Link</span>
          <span class="btn-spinner"></span>
        </button>
      </form>
    </div>

    <!-- Step 2: success -->
    <div class="step step-success" id="stepSuccess">
      <div class="check-badge">
        <svg viewBox="0 0 52 52" class="check-svg">
          <circle cx="26" cy="26" r="24" class="check-circle" />
          <path d="M14 27 l8 8 l16 -16" class="check-mark" />
        </svg>
      </div>
      <h1>Check your inbox</h1>
      <p class="subtext">
        We've sent a password reset link to <strong id="sentEmail">you@example.com</strong>.
        It expires in 15 minutes.
      </p>

      <button type="button" class="submit-btn secondary-btn" id="resendBtn">Resend link</button>
      <p class="resend-timer" id="resendTimer"></p>

      <a href="signin.html" class="switch-link-btn">Back to sign in</a>
    </div>

  </div>

  <div class="reset-clouds">
    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="Forget-password.js"></script>
</body>
</html>
